when:
  - event: push
    branch: master

depends_on:
  - build-api
  - build-web

steps:
  - name: deploy
    image: docker:27-cli
    environment:
      DOCKER_USERNAME:
        from_secret: DOCKER_USERNAME
      DOCKER_PASSWORD:
        from_secret: DOCKER_PASSWORD
      STAGING_WORK_DIR:
        from_secret: STAGING_WORK_DIR
      STAGING_ENV_FILE:
        from_secret: STAGING_ENV_FILE
      IMAGE_TAG: staging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - cd "$STAGING_WORK_DIR"
      - echo "$STAGING_ENV_FILE" > .env
      - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      - docker compose pull
      - docker compose up -d --force-recreate --remove-orphans
      - docker compose ps
      - echo "Staging deployment completed successfully!"
      - docker logout
      
  - name: cleanup
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker image prune -af --filter "until=24h"
      - docker container prune -f --filter "until=24h"
      - docker network prune -f
    depends_on:
      - deploy
    failure: ignore