when:
  - event: push
    branch: master

steps:
  - name: build-api
    image: docker:27-cli
    environment:
      DOCKER_USERNAME: { from_secret: DOCKER_USERNAME }
      DOCKER_PASSWORD: { from_secret: DOCKER_PASSWORD }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      - |
        docker buildx build \
          --file ./apps/api/Dockerfile \
          --cache-from "$DOCKER_USERNAME/api:staging" \
          --tag "$DOCKER_USERNAME/api:staging" \
          --tag "$DOCKER_USERNAME/api:${CI_COMMIT_SHA:0:8}" \
          --push .

  - name: build-web
    image: docker:27-cli
    environment:
      DOCKER_USERNAME: { from_secret: DOCKER_USERNAME }
      DOCKER_PASSWORD: { from_secret: DOCKER_PASSWORD }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      - |
        docker buildx build \
          --file ./apps/web/Dockerfile \
          --cache-from "$DOCKER_USERNAME/web:staging" \
          --tag "$DOCKER_USERNAME/web:staging" \
          --tag "$DOCKER_USERNAME/web:${CI_COMMIT_SHA:0:8}" \
          --push .
      - docker logout

  - name: deploy-staging
    image: docker:27-cli
    environment:
      STAGING_ENV_FILE: { from_secret: STAGING_ENV_FILE }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/super/services/okiba/staging:/staging
    commands:
      - cd /staging
      - echo "$STAGING_ENV_FILE" > .env
      - echo "IMAGE_TAG=staging" >> .env
      - docker compose up -d --force-recreate --remove-orphans
      - 'echo "✓ Staging environment updated with latest master code."'
    depends_on: [ build-api, build-web ]

  - name: cleanup
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker image prune -f --filter "until=24h"
      - 'echo "🧹 Temporary build artifacts cleaned up."'
    depends_on: [ deploy-staging ]
    failure: ignore