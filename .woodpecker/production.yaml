when:
  - event: tag

steps:
  - name: validate-tag
    image: alpine:3.19
    commands:
      - |
        if ! echo "$CI_COMMIT_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "❌ Error: Tag must be vX.Y.Z"
          exit 1
        fi

  - name: extract-version
    image: alpine:3.19
    commands:
      - |
        VERSION="${CI_COMMIT_TAG#v}"
        echo "export VERSION=$VERSION" > version.env

  - name: promote-and-push
    image: docker:27-cli
    environment:
      DOCKER_USERNAME: { from_secret: DOCKER_USERNAME }
      DOCKER_PASSWORD: { from_secret: DOCKER_PASSWORD }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - . ./version.env
      - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      - docker tag "$DOCKER_USERNAME/api:staging" "$DOCKER_USERNAME/api:$VERSION"
      - docker tag "$DOCKER_USERNAME/api:staging" "$DOCKER_USERNAME/api:latest"
      - docker tag "$DOCKER_USERNAME/web:staging" "$DOCKER_USERNAME/web:$VERSION"
      - docker tag "$DOCKER_USERNAME/web:staging" "$DOCKER_USERNAME/web:latest"
      - docker push "$DOCKER_USERNAME/api:$VERSION"
      - docker push "$DOCKER_USERNAME/api:latest"
      - docker push "$DOCKER_USERNAME/web:$VERSION"
      - docker push "$DOCKER_USERNAME/web:latest"
      - docker logout
      - 'echo "✓ Images promoted to $VERSION and pushed to Hub."'
    depends_on: [ extract-version ]

  - name: deploy-production
    image: docker:27-cli
    environment:
      PRODUCTION_ENV_FILE: { from_secret: PRODUCTION_ENV_FILE }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/super/services/okiba/production:/production
    commands:
      - . ./version.env
      - cd /production
      - echo "$PRODUCTION_ENV_FILE" > .env
      - echo "IMAGE_TAG=$VERSION" >> .env
      - docker compose up -d --force-recreate --remove-orphans
    depends_on: [ promote-and-push ]

  - name: release-summary
    image: alpine:3.19
    commands:
      - . ./version.env
      - |
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🚀 PRODUCTION RELEASE SUCCESSFUL"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "Version:    $VERSION"
        echo "Tag:        $CI_COMMIT_TAG"
        echo "Commit:     ${CI_COMMIT_SHA:0:8}"
        echo "Status:     Deployed to Production VPS"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    depends_on: [ deploy-production ]