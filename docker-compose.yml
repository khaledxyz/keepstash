services:
  api:
    image: okiba/api:staging
    container_name: okiba-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.okiba-api-http.entrypoints=http"
      - "traefik.http.routers.okiba-api-http.rule=Host(`${HOST}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.okiba-api-secure.priority=100"
      - "traefik.http.routers.okiba-api-http.middlewares=https-redirect@file"
      - "traefik.http.routers.okiba-api-secure.entrypoints=https"
      - "traefik.http.routers.okiba-api-secure.rule=Host(`${HOST}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.okiba-api-secure.priority=100"
      - "traefik.http.routers.okiba-api-secure.tls=true"
      - "traefik.http.routers.okiba-api-secure.tls.certresolver=le"
      - "traefik.http.routers.okiba-api-secure.tls.options=modern-tls@file"
      - "traefik.http.services.okiba-api.loadbalancer.server.port=5000"
    networks:
      - proxy-network
      - backend

  web:
    image: okiba/web:staging
    container_name: okiba-web
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.okiba-web-http.entrypoints=http"
      - "traefik.http.routers.okiba-web-http.rule=Host(`${HOST}`)"
      - "traefik.http.routers.okiba-web-http.middlewares=https-redirect@file"
      - "traefik.http.routers.okiba-web-secure.entrypoints=https"
      - "traefik.http.routers.okiba-web-secure.rule=Host(`${HOST}`)"
      - "traefik.http.routers.okiba-web-secure.tls=true"
      - "traefik.http.routers.okiba-web-secure.tls.certresolver=le"
      - "traefik.http.routers.okiba-web-secure.tls.options=modern-tls@file"
      - "traefik.http.services.okiba-web.loadbalancer.server.port=80"
    networks:
      - proxy-network
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: okiba-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

volumes:
  postgres_data:

networks:
  proxy-network:
    external: true
    name: ${PROXY_NETWORK}
  backend:
    internal: true
